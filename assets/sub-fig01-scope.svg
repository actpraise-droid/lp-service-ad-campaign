<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880">
  <title>役割の分界図。当社が行うのはWeb・LP制作の目的整理、問い合わせや予約・見積導線の設計、対象になり得る施策の棚卸し、見積書や仕様書など制作側資料の準備、制作と公開後の改善。当社が行わないのは補助金の採択や受給の保証、申請書の作成代行、申請手続きの代理提出、法律・税務・労務の判断、実態と異なる名義や経費での支援。申請の主体はお客様自身または支援機関・専門家</title>
  <defs>
    <pattern id="subg1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#0e0e10" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .m { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .j { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; }
    .hd { font-weight: 700; font-size: 28px; fill: #f1f1ec; }
    .it { font-size: 26px; fill: #0e0e10; }
  </style>

  <rect width="1000" height="880" fill="#ffffff"/>
  <rect width="1000" height="880" fill="url(#subg1)"/>

  <g stroke="#0e0e10" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M17 24h14M24 17v14"/><path d="M969 24h14M976 17v14"/>
    <path d="M17 856h14M24 849v14"/><path d="M969 856h14M976 849v14"/>
  </g>

  <text class="m" x="40" y="60" font-size="22" fill="#55554f" letter-spacing="0.12em">WHAT WE DO / WHAT WE DO NOT</text>

  <!-- 左：当社が行うこと -->
  <rect x="40" y="96" width="450" height="64" fill="#0e0e10"/>
  <text class="j hd" x="66" y="137">当社が行うこと</text>
  <rect x="40" y="160" width="450" height="500" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>

  <rect x="66" y="204" width="18" height="18" fill="#0e0e10"/>
  <text class="j it" x="98" y="223">Web・LPの目的整理</text>

  <rect x="66" y="290" width="18" height="18" fill="#0e0e10"/>
  <text class="j it" x="98" y="309">問い合わせ・予約・</text>
  <text class="j it" x="98" y="345">見積導線の設計</text>

  <rect x="66" y="412" width="18" height="18" fill="#0e0e10"/>
  <text class="j it" x="98" y="431">対象になり得る</text>
  <text class="j it" x="98" y="467">施策の棚卸し</text>

  <rect x="66" y="534" width="18" height="18" fill="#0e0e10"/>
  <text class="j it" x="98" y="553">見積書・仕様書など</text>
  <text class="j it" x="98" y="589">制作側資料の準備</text>

  <line x1="500" y1="96" x2="500" y2="660" stroke="#c9c9c2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 右：当社が行わないこと -->
  <rect x="510" y="96" width="450" height="64" fill="#c1210f"/>
  <text class="j hd" x="536" y="137">当社が行わないこと</text>
  <rect x="510" y="160" width="450" height="500" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>

  <g stroke="#c1210f" stroke-width="3">
    <path d="M536 204l18 18M554 204l-18 18"/>
    <path d="M536 290l18 18M554 290l-18 18"/>
    <path d="M536 412l18 18M554 412l-18 18"/>
    <path d="M536 534l18 18M554 534l-18 18"/>
  </g>
  <text class="j it" x="568" y="223">採択・受給の保証</text>
  <text class="j it" x="568" y="309">申請書の作成代行</text>
  <text class="j it" x="568" y="431">申請手続きの</text>
  <text class="j it" x="568" y="467">代理提出</text>
  <text class="j it" x="568" y="553">法律・税務・労務の</text>
  <text class="j it" x="568" y="589">専門判断</text>

  <rect x="40" y="700" width="920" height="100" fill="#cdff00" stroke="#0e0e10" stroke-width="2"/>
  <text class="j" x="500" y="736" font-size="27" font-weight="700" fill="#0e0e10" text-anchor="middle">申請の主体は、お客様ご自身または</text>
  <text class="j" x="500" y="778" font-size="27" font-weight="700" fill="#0e0e10" text-anchor="middle">支援機関・専門家です</text>

  <text class="j" x="40" y="842" font-size="22" fill="#55554f">※ 制度の対象可否は各制度の要件によります。窓口や専門家への確認をご案内します。</text>
</svg>
