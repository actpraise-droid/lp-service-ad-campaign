<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <title>導入時の分担図。店舗側が用意するのはLINEグループ・各SNSアカウント・現場の写真の3つで、初期設定とSNS接続作業、サーバー費用、AI文章生成費用、X投稿費用は提供側が負担する</title>
  <defs>
    <pattern id="grid04" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#0e0e10" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .m { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .j { font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; }
    .hd { font-weight: 700; font-size: 28px; fill: #f1f1ec; }
    .it { font-size: 28px; fill: #0e0e10; }
    .sb { font-size: 20px; fill: #55554f; }
  </style>

  <rect width="1000" height="800" fill="#ffffff"/>
  <rect width="1000" height="800" fill="url(#grid04)"/>

  <g stroke="#0e0e10" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M17 24h14M24 17v14"/>
    <path d="M969 24h14M976 17v14"/>
    <path d="M17 776h14M24 769v14"/>
    <path d="M969 776h14M976 769v14"/>
  </g>

  <text class="m" x="40" y="60" font-size="22" fill="#55554f" letter-spacing="0.12em">WHO PROVIDES WHAT</text>

  <!-- left : the shop -->
  <rect x="40" y="96" width="450" height="64" fill="#0e0e10"/>
  <text class="j hd" x="66" y="137">店舗側が用意するもの</text>
  <rect x="40" y="160" width="450" height="460" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>

  <rect x="66" y="210" width="20" height="20" fill="#ffffff" stroke="#0e0e10" stroke-width="2"/>
  <text class="j it" x="100" y="232">投稿用のLINEグループ</text>
  <text class="j sb" x="100" y="264">新規に作成</text>

  <rect x="66" y="290" width="20" height="20" fill="#ffffff" stroke="#0e0e10" stroke-width="2"/>
  <text class="j it" x="100" y="312">各SNSアカウント</text>
  <text class="j sb" x="100" y="344">Google / X / Instagram</text>

  <rect x="66" y="370" width="20" height="20" fill="#ffffff" stroke="#0e0e10" stroke-width="2"/>
  <text class="j it" x="100" y="392">現場で撮った写真</text>
  <text class="j sb" x="100" y="424">普段の作業写真で足ります</text>

  <rect x="66" y="500" width="8" height="26" fill="#cdff00"/>
  <text class="j" x="88" y="521" font-size="24" fill="#0e0e10">用意するのはこの3つだけ</text>

  <!-- divider -->
  <line x1="500" y1="96" x2="500" y2="620" stroke="#c9c9c2" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- right : the provider -->
  <rect x="510" y="96" width="450" height="64" fill="#0e0e10"/>
  <text class="j hd" x="536" y="137">提供側が負担するもの</text>
  <rect x="510" y="160" width="450" height="460" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.5"/>

  <rect x="536" y="210" width="20" height="20" fill="#0e0e10"/>
  <text class="j it" x="570" y="232">初期設定・SNS接続作業</text>
  <text class="j sb" x="570" y="264">こちらで実施します</text>

  <rect x="536" y="290" width="20" height="20" fill="#0e0e10"/>
  <text class="j it" x="570" y="312">サーバー費用</text>
  <text class="j sb" x="570" y="344">稼働に必要な分</text>

  <rect x="536" y="370" width="20" height="20" fill="#0e0e10"/>
  <text class="j it" x="570" y="392">AI文章生成の費用</text>
  <text class="j sb" x="570" y="424">投稿ごとに発生する分</text>

  <rect x="536" y="450" width="20" height="20" fill="#0e0e10"/>
  <text class="j it" x="570" y="472">Xの投稿費用</text>
  <text class="j sb" x="570" y="504">API利用に伴う分</text>

  <!-- conclusion -->
  <rect x="40" y="660" width="920" height="80" fill="#cdff00" stroke="#0e0e10" stroke-width="2"/>
  <text class="j" x="500" y="708" font-size="30" font-weight="700" fill="#0e0e10" text-anchor="middle">店舗側での追加API契約・追加費用は必要ありません</text>
</svg>
